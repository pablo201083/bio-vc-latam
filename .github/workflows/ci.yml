name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Guard against stale theme name regression
        run: |
          if grep -rn --include="*.py" "Fermentation Economy" src/ | grep -v vocabularies.py; then
            echo "Found 'Fermentation Economy' outside the alias table in vocabularies.py"
            exit 1
          fi

      - name: Run tests
        run: python -m pytest tests/ -q
