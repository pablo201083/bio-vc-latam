<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capital Network Atlas · BIO LATAM</title>
  <link rel="stylesheet" href="./styles.css?v=20260422p">
  <style>
    html, body.capital-atlas-page {
      height: 100%;
    }
    body.capital-atlas-page {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    body.capital-atlas-page .page-shell {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 8px 14px 10px;
      gap: 8px;
      max-width: 100%;
      margin: 0;
    }

    /* ── Hero strip ────────────────────────────────────────────────── */
    .ca-strip {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .ca-strip-title {
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    .ca-strip-stats {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .ca-strip-stat {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.78);
      padding: 3px 10px;
      font-size: .72rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .ca-strip-stat strong {
      font-weight: 800;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    /* ── Main layout ───────────────────────────────────────────────── */
    .ca-layout {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      gap: 10px;
    }

    /* ── Investor sidebar ──────────────────────────────────────────── */
    .ca-inv-sidebar {
      width: 340px;
      min-width: 0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
      /* No overflow:hidden here — let children manage their own overflow */
    }
    .ca-inv-head {
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(248,243,234,.72));
      flex-shrink: 0;
      border-radius: 20px 20px 0 0;  /* match parent corners */
    }
    .ca-inv-head-title {
      font-size: .9rem;
      font-weight: 800;
      line-height: 1;
      color: var(--ink);
    }
    .ca-inv-head-sub {
      font-size: .7rem;
      color: var(--muted);
      margin-top: 3px;
    }
    .ca-inv-search-wrap {
      padding: 7px 10px;
      border-bottom: 1px solid rgba(217,206,190,.5);
      flex-shrink: 0;
    }
    .ca-inv-search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: .78rem;
      padding: 6px 9px;
      box-sizing: border-box;
    }
    .ca-inv-list {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      /* flex column — each card sizes to its content, no height collapse */
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* ── Investor card ─────────────────────────────────────────────── */
    .iv {
      border: 1px solid rgba(217,206,190,.7);
      border-radius: 14px;
      background: rgba(255,255,255,.76);
      cursor: pointer;
      transition: border-color 90ms, background 90ms, box-shadow 90ms;
      overflow: hidden;
      flex-shrink: 0;
      min-height: 52px;
    }
    .iv:hover { border-color: rgba(92,82,70,.28); background: rgba(255,255,255,.96); box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .iv.active {
      border-color: var(--accent);
      background: rgba(58,168,163,.06);
    }
    .iv-header {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 11px 5px;
      min-height: 36px;
    }
    .iv-logo {
      width: 30px; height: 30px;
      border-radius: 7px;
      object-fit: contain;
      background: #f2ede6;
      flex-shrink: 0;
      display: block;
    }
    .iv-logo-ph {
      width: 30px; height: 30px;
      border-radius: 7px;
      background: linear-gradient(135deg,#ede8e0,#d8d0c4);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .62rem; font-weight: 800; color: #a09080; letter-spacing: .03em;
      text-transform: uppercase;
    }
    .iv-name-wrap { flex: 1; min-width: 0; }
    .iv-name {
      font-size: .8rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .iv-count {
      font-size: .68rem;
      font-weight: 800;
      color: var(--muted);
      background: rgba(0,0,0,.07);
      border-radius: 5px;
      padding: 2px 6px;
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .iv.active .iv-count { background: rgba(15,118,110,.14); color: var(--accent); }
    .iv-preview {
      padding: 0 11px 9px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .iv-theme-bar {
      height: 5px;
      border-radius: 999px;
      background: #eadfce;
      overflow: hidden;
      display: flex;
    }
    .iv-theme-seg { height: 100%; }
    .iv-countries {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .iv-country {
      font-size: .67rem;
      color: var(--muted);
      background: rgba(233,224,210,.55);
      border-radius: 999px;
      padding: 1px 6px;
    }
    /* Accordion detail */
    .iv-detail { display: none; padding: 0 10px 10px; }
    .iv.active .iv-detail { display: block; }
    .iv-det-section {
      font-size: .67rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 8px 0 4px;
    }
    .iv-det-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(217,206,190,.35);
      font-size: .73rem;
    }
    .iv-det-row:last-child { border-bottom: 0; }
    .iv-det-row span { color: var(--muted); }
    .iv-det-row strong { font-weight: 700; color: var(--ink); }
    .iv-det-theme-bar {
      height: 5px;
      border-radius: 999px;
      background: #eadfce;
      overflow: hidden;
      margin: 2px 0;
    }
    .iv-det-theme-bar span { display: block; height: 100%; border-radius: 999px; }
    .iv-type-chip {
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 2px 6px;
      flex-shrink: 0;
    }
    .iv-type-fund { background: rgba(217,119,6,.12); color: #92400e; }
    .iv-type-allocator { background: rgba(109,40,217,.12); color: #5b21b6; }
    .iv-type-accelerator { background: rgba(5,150,105,.12); color: #065f46; }

    /* ── Canvas area ───────────────────────────────────────────────── */
    .ca-canvas-area {
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .ca-toolbar {
      padding: 7px 12px 6px;
      border-bottom: 1px solid rgba(217,206,190,.44);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .ca-stage {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 60% 45%, rgba(58,168,163,.035), transparent 55%),
        radial-gradient(ellipse at 28% 68%, rgba(217,119,6,.04), transparent 45%),
        linear-gradient(160deg, rgba(255,252,248,.94), rgba(242,234,220,.8));
    }

    /* ── Toolbar controls ──────────────────────────────────────────── */
    .atlas-button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 5px 10px;
      font: inherit;
      font-size: .76rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .atlas-button:hover, .atlas-button.active {
      border-color: var(--accent);
      background: rgba(58,168,163,.1);
    }
    .atlas-select {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 5px 8px;
      font-size: .76rem;
    }
    .atlas-search-wrap { position: relative; min-width: 0; flex: 1; max-width: 280px; }
    .atlas-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 5px 9px;
      font-size: .78rem;
      box-sizing: border-box;
    }
    .atlas-search-results {
      position: absolute;
      z-index: 8;
      left: 0; right: 0;
      top: calc(100% + 5px);
      display: none;
      max-height: 240px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,252,246,.98);
      box-shadow: var(--shadow);
      padding: 5px;
    }
    .atlas-search-results.open { display: grid; gap: 3px; }
    .atlas-search-result {
      border: 0; border-radius: 9px;
      background: transparent; color: var(--ink);
      cursor: pointer; display: grid; gap: 2px;
      padding: 7px 9px; text-align: left; font: inherit;
    }
    .atlas-search-result:hover { background: rgba(58,168,163,.12); }
    .atlas-search-result small { color: var(--muted); font-size: .74rem; }

    /* ── Atlas graph components (used by capital-atlas.js) ─────────── */
    #capital-atlas-svg { display: block; width: 100%; height: 100%; position: relative; z-index: 2; }
    .atlas-tooltip {
      position: absolute; z-index: 7;
      left: 18px; top: 18px;
      width: min(340px, calc(100% - 40px));
      border: 1px solid rgba(217,206,190,.78);
      border-radius: 18px;
      background: rgba(255,252,248,.97);
      box-shadow: 0 24px 60px rgba(54,45,35,.18), 0 4px 14px rgba(54,45,35,.08);
      backdrop-filter: blur(16px);
      padding: 13px 14px;
      opacity: 0; transform: translateY(8px);
      gap: 9px; pointer-events: auto;
      transition: opacity 140ms ease, transform 140ms ease;
    }
    .atlas-tooltip.visible { display: grid; opacity: 1; transform: translateY(0); }
    .tooltip-header { display: flex; align-items: flex-start; gap: 12px; }
    .tooltip-logo {
      width: 42px; height: 42px; border-radius: 10px;
      object-fit: contain; background: #f2ede6;
      flex-shrink: 0; display: block;
      border: 1px solid rgba(217,206,190,.5);
    }
    .tooltip-logo-ph {
      width: 42px; height: 42px; border-radius: 10px;
      background: linear-gradient(135deg,#ede8e0,#d8d0c4);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: .7rem; font-weight: 800; color: #a09080; letter-spacing: .03em;
      text-transform: uppercase; border: 1px solid rgba(217,206,190,.4);
    }
    .tooltip-header-text { flex: 1; min-width: 0; }
    .tooltip-kicker { color: var(--accent); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 900; }
    .tooltip-title { font-weight: 900; font-size: 1rem; line-height: 1.08; }
    .tooltip-meta { color: var(--muted); font-size: .78rem; line-height: 1.35; }
    .tooltip-chip-row { display: flex; flex-wrap: wrap; gap: 5px; }
    .tooltip-chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.84); color: var(--muted); font-size: .72rem; padding: 3px 7px; }
    .tooltip-chip-dot { width: 7px; height: 7px; border-radius: 999px; flex: 0 0 auto; }
    .tooltip-stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 5px; }
    .tooltip-stat { border: 1px solid rgba(217,206,190,.74); border-radius: 10px; background: rgba(255,255,255,.76); padding: 5px 6px; }
    .tooltip-stat span { display: block; color: var(--muted); font-size: .64rem; }
    .tooltip-stat strong { display: block; margin-top: 2px; font-size: .9rem; }
    .atlas-controls { position: absolute; right: 12px; top: 12px; display: grid; gap: 6px; z-index: 5; }
    .atlas-zoom { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.95); box-shadow: var(--shadow); font: inherit; font-size: .94rem; cursor: pointer; }
    .atlas-zoom.hint { width: auto; min-width: 36px; padding: 0 8px; font-size: .7rem; color: var(--muted); cursor: default; }

    /* Inspector classes (used by capital-atlas.js renderDetail) */
    .stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 7px; }
    .stat-grid.compact { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 5px; }
    .stat-card { border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.78); padding: 7px 8px; }
    .stat-label { color: var(--muted); font-size: .72rem; margin-bottom: 3px; }
    .stat-value { font-weight: 800; font-size: 1rem; }
    .ranking-list { display: grid; gap: 7px; }
    .theme-mix-list { display: grid; gap: 8px; }
    .theme-mix-row { display: grid; gap: 4px; }
    .theme-mix-top { display: flex; justify-content: space-between; gap: 8px; color: var(--ink); font-size: .84rem; font-weight: 700; }
    .theme-mix-bar { height: 7px; border-radius: 999px; background: #eadfce; overflow: hidden; display: flex; }
    .theme-mix-fill { height: 100%; }
    .theme-mix-fill.mapped { border-radius: 999px 0 0 999px; }
    .theme-mix-fill.gap { background: rgba(120,108,92,.26); border-radius: 0 999px 999px 0; }
    .theme-mix-foot { color: var(--muted); font-size: .73rem; }
    .ranking-row { border: 1px solid rgba(217,206,190,.78); border-radius: 12px; background: rgba(255,255,255,.76); padding: 8px 9px; cursor: pointer; display: grid; gap: 4px; }
    .ranking-row:hover { border-color: var(--accent); }
    .ranking-row.active { border-color: var(--accent); background: rgba(58,168,163,.1); }
    .ranking-top { display: flex; justify-content: space-between; gap: 8px; color: var(--ink); font-weight: 700; line-height: 1.25; }
    .ranking-meta, .detail-muted { color: var(--muted); font-size: .82rem; line-height: 1.42; }
    .detail-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .detail-chip { border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--muted); font-size: .76rem; padding: 3px 8px; }
    .edge-list { display: grid; gap: 6px; max-height: 240px; overflow: auto; }
    .edge-list.compact { max-height: 160px; }
    .edge-item { border: 1px solid rgba(217,206,190,.78); border-radius: 11px; background: rgba(255,255,255,.7); padding: 7px 8px; }
    button.edge-item { color: inherit; font: inherit; text-align: left; cursor: pointer; }
    button.edge-item:hover { border-color: var(--accent); background: rgba(58,168,163,.08); }
    .detail-title-card { border: 1px solid rgba(217,206,190,.78); border-radius: 15px; background: linear-gradient(135deg,rgba(255,255,255,.88),rgba(248,243,234,.78)); padding: 10px 11px; display: grid; gap: 4px; }
    .detail-title-card h3, .detail-block h3 { margin: 0; font-size: .98rem; line-height: 1.12; }
    .detail-title-card p { margin: 3px 0 0; color: var(--muted); font-size: .82rem; line-height: 1.42; }
    .organization-card { border-color: rgba(15,118,110,.22); background: radial-gradient(circle at 92% 0%, rgba(209,244,238,.66), transparent 7rem), linear-gradient(135deg, rgba(255,255,255,.92), rgba(248,243,234,.82)); }
    .organization-kicker { color: var(--accent); font-size: .7rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .org-insight-grid { display: grid; gap: 7px; }
    .org-insight-card { border: 1px solid rgba(217,206,190,.78); border-radius: 13px; background: rgba(255,255,255,.72); padding: 8px 9px; display: grid; gap: 3px; }
    .org-insight-card span { color: var(--muted); font-size: .72rem; }
    .org-insight-card strong { color: #332b22; font-size: .82rem; line-height: 1.35; }
    .detail-subtitle { color: var(--accent); font-size: .8rem; font-weight: 800; }
    .detail-block { display: grid; gap: 7px; padding-top: 3px; }
    .detail-callout { border: 1px solid rgba(15,118,110,.22); border-radius: 13px; background: rgba(209,244,238,.32); padding: 8px 9px; display: grid; gap: 3px; color: var(--muted); font-size: .8rem; line-height: 1.38; }
    .detail-callout strong { color: var(--accent); font-size: .88rem; }
    .detail-bars { display: grid; gap: 7px; }
    .detail-bar-row { display: grid; gap: 3px; }
    .detail-bar-top { display: flex; justify-content: space-between; gap: 8px; font-size: .78rem; font-weight: 800; }
    .detail-bar-track { height: 6px; border-radius: 999px; background: #eadfce; overflow: hidden; }
    .detail-bar-track span { display: block; height: 100%; border-radius: 999px; }
    .detail-bar-foot, .connection-source { color: var(--muted); font-size: .7rem; }
    .detail-country-line { display: flex; flex-wrap: wrap; gap: 4px; }
    .detail-country-line span { border-radius: 999px; background: rgba(233,224,210,.72); color: var(--muted); font-size: .72rem; padding: 2px 6px; }
    .connection-card { display: grid; gap: 3px; }
    .connection-evidence { color: var(--accent); font-size: .74rem; font-weight: 800; }
    .detail-empty { border: 1px dashed rgba(154,140,120,.45); border-radius: 11px; color: var(--muted); padding: 8px 9px; font-size: .8rem; }
    .detail-metric-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
    .detail-metric { border: 1px solid rgba(217,206,190,.76); border-radius: 11px; background: rgba(255,255,255,.76); padding: 7px; }
    .detail-metric span { display: block; color: var(--muted); font-size: .7rem; }
    .detail-metric strong { display: block; font-size: 1rem; margin-top: 2px; }
    .detail-metric.primary { border-color: rgba(15,118,110,.28); background: rgba(209,244,238,.28); }
    .detail-metric.primary strong { color: var(--accent); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .panel-head h2 { margin: 0; font-size: .88rem; }
    .atlas-note { color: var(--muted); font-size: .73rem; line-height: 1.4; }
    .atlas-map-inspector { display: none; }

    /* ── View switcher ─────────────────────────────────────────────── */
    .vs-group {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .vs-btn {
      border: 0;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,.82);
      color: var(--muted);
      font: inherit;
      font-size: .74rem;
      font-weight: 600;
      padding: 5px 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 80ms, color 80ms;
    }
    .vs-btn:last-child { border-right: 0; }
    .vs-btn:hover { background: rgba(255,255,255,1); color: var(--ink); }
    .vs-btn.active {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .ca-net-controls { display: flex; gap: 5px; align-items: center; }
    .tb-divider {
      width: 1px; height: 20px; background: var(--line); flex-shrink: 0; margin: 0 2px;
    }
    .tb-toggle-group {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .tb-toggle {
      border: 0;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,.82);
      color: var(--muted);
      font: inherit;
      font-size: .8rem;
      font-weight: 600;
      padding: 4px 9px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 80ms, color 80ms;
      min-width: 30px;
    }
    .tb-toggle:last-child { border-right: 0; }
    .tb-toggle:hover { background: #fff; color: var(--ink); }
    .tb-toggle.active {
      background: rgba(15,118,110,.10);
      color: var(--accent);
      font-weight: 700;
    }

    /* ── Canvas view panels ────────────────────────────────────────── */
    .ca-view { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    .ca-view.active { display: block; }

    /* ── Radial view ───────────────────────────────────────────────── */
    #radial-svg { display: block; width: 100%; height: 100%; }
    .radial-hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: .72rem;
      color: var(--muted);
      background: rgba(255,252,246,.82);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 12px;
      pointer-events: none;
    }

    /* ── Matrix view ───────────────────────────────────────────────── */
    #view-matrix { overflow: hidden; }
    #view-matrix.active { display: flex; align-items: center; justify-content: center; }
    #matrix-svg { display: block; max-width: 100%; max-height: 100%; }

    /* ── Stage Ladder view ─────────────────────────────────────────── */
    #view-stages { overflow: auto; }
    #view-stages.active { display: block; }
    #stages-wrap {
      padding: 18px 22px;
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .sl-left {
      flex: 1 1 0;
      min-width: 0;
      overflow-x: auto;
    }
    .sl-title {
      font-size: .78rem; font-weight: 700; letter-spacing: .05em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
    }
    .sl-legend {
      display: flex; gap: 14px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .sl-legend-item {
      display: flex; align-items: center; gap: 5px;
      font-size: .7rem; color: var(--muted);
    }
    .sl-legend-dot {
      width: 10px; height: 10px; border-radius: 50%;
    }
    .sl-grid { border-collapse: collapse; width: 100%; }
    .sl-grid th {
      font-size: .68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .04em; color: var(--muted); padding: 5px 8px;
      border-bottom: 1.5px solid var(--line); text-align: center;
      white-space: nowrap;
    }
    .sl-grid th.sl-name-col { text-align: left; min-width: 140px; }
    .sl-grid td {
      padding: 4px 6px; border-bottom: 1px solid rgba(217,206,190,.3);
      vertical-align: middle;
    }
    .sl-grid td.sl-name-col {
      font-size: .76rem; font-weight: 600; color: var(--ink);
      max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sl-grid tr:hover td { background: rgba(11,143,135,.04); }
    .sl-grid td.sl-center { text-align: center; }
    .sl-dot {
      display: inline-block; width: 11px; height: 11px; border-radius: 50%;
      vertical-align: middle;
    }
    .sl-dot.core  { background: var(--accent); }
    .sl-dot.ext   { background: #1A6DB5; }
    .sl-dot.empty { background: rgba(160,152,140,.18); border: 1.5px solid rgba(160,152,140,.3); }
    .sl-badge {
      font-size: .65rem; font-weight: 700; border-radius: 4px;
      padding: 1px 5px; display: inline-block; white-space: nowrap;
    }
    .sl-type-vc          { background: rgba(11,143,135,.12); color: #0B8F87; }
    .sl-type-accelerator { background: rgba(26,109,181,.1);  color: #1A6DB5; }
    .sl-type-impact_fund { background: rgba(42,122,66,.12);  color: #2A7A42; }
    .sl-type-corporate_vc { background: rgba(107,140,58,.12); color: #6B8C3A; }
    .sl-type-company_builder { background: rgba(139,109,20,.12); color: #8B6D14; }
    .sl-type-multilateral { background: rgba(160,152,140,.15); color: #847E73; }
    .sl-type-fund_of_funds { background: rgba(112,51,188,.1); color: #7033BC; }
    .sl-type-development_finance { background: rgba(160,152,140,.15); color: #847E73; }
    .sl-aum {
      font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .sl-gap-banner {
      margin-top: 16px; padding: 10px 14px; border-radius: 8px;
      background: rgba(194,90,42,.08); border: 1px solid rgba(194,90,42,.22);
      font-size: .75rem; color: #7a3a18; line-height: 1.5;
    }
    .sl-gap-banner strong { color: #C25A2A; }

    /* ── Stage Ladder — theme bars ────────────────────────────────── */
    .sl-theme-bar { display:flex; height:7px; border-radius:3px; overflow:hidden; min-width:110px; }
    .sl-theme-tags { display:flex; flex-wrap:wrap; gap:2px; margin-top:3px; }
    .sl-theme-tag  { font-size:.58rem; padding:1px 5px; border-radius:2px; white-space:nowrap; font-weight:600; }

    /* ── Fund profile card ────────────────────────────────────────── */
    #fund-profile-card {
      width: 320px;
      flex-shrink: 0;
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      background: rgba(245,241,234,.75);
      border: 1px solid rgba(160,152,140,.25);
      border-radius: 10px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .fp-placeholder {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 8px;
      height: 200px; color: var(--muted); font-size: .75rem; text-align: center;
    }
    .fp-placeholder-icon { font-size: 1.8rem; opacity: .4; }
    .fp-header { display:flex; align-items:baseline; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
    .fp-name { font-size:1.12rem; font-weight:800; color:#1a1614; }
    .fp-flag { font-size:1.1rem; }
    .fp-stats { display:flex; gap:20px; margin-bottom:16px; flex-wrap:wrap; }
    .fp-stat { display:flex; flex-direction:column; }
    .fp-stat-label { font-size:.63rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:2px; }
    .fp-stat-value { font-weight:700; font-size:.82rem; color:#1a1614; }
    .fp-theme-section { margin-bottom:16px; }
    .fp-theme-bar-lg { display:flex; height:11px; border-radius:5px; overflow:hidden; margin-bottom:8px; }
    .fp-theme-legend { display:flex; flex-wrap:wrap; gap:8px; }
    .fp-theme-item { display:flex; align-items:center; gap:4px; font-size:.68rem; color:#4a423b; }
    .fp-theme-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
    .fp-theme-count { color:var(--muted); }
    .fp-paragraphs { display:flex; flex-direction:column; gap:10px; border-top:1px solid rgba(160,152,140,.2); padding-top:14px; }
    .fp-para { font-size:.77rem; line-height:1.65; color:#3a3028; }
    .fp-para strong { color:#1a1614; }

    /* ── Sankey / Capital Flow view ────────────────────────────────── */
    #view-flow { overflow: auto; }
    #view-flow.active { display: block; }
    #flow-wrap { padding: 18px 22px; min-width: 700px; }
    #flow-svg { display: block; }
    .sk-node-label { font-family: inherit; pointer-events: none; }
    .sk-link { fill: none; }
    .sk-node rect { stroke: none; rx: 3; }
    .sk-tooltip {
      position: absolute; pointer-events: none;
      background: rgba(255,252,246,.97); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 12px; font-size: .73rem;
      color: var(--ink); max-width: 220px; line-height: 1.5;
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
      display: none;
    }

  </style>
</head>
