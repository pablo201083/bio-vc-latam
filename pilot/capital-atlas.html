<script>
document.addEventListener('DOMContentLoaded', function(){

  const D = window.CAPITAL_ATLAS_DATA;
  if (!D || !D.nodes) return;
  const NS = 'http://www.w3.org/2000/svg';

  // ── Palettes ──────────────────────────────────────────────────────────
  const THEME_PAL = {
    "Therapeutics":                              "#7033BC",
    "Diagnostics & Health Access":               "#1A6DB5",
    "Food Systems & Alt Proteins":               "#C25A2A",
    "Bioinputs & Crop Resilience":               "#2A7A42",
    "Nature & Ecosystem Tech":                   "#127A6E",
    "Farm Intelligence":                         "#2E4E8C",
    "Biomaterials & Circular Economy":           "#8B6D14",
    "Biomanufacturing & Platform Technologies":  "#6B8C3A",
    // legacy alias — keeps old data working during transition
    "Biomanufacturing & Fermentation Economy":   "#6B8C3A",
  };
  const THEME_SHORT = {
    "Therapeutics":                              "Therapeutics",
    "Diagnostics & Health Access":               "Diagnostics",
    "Food Systems & Alt Proteins":               "Food Systems",
    "Bioinputs & Crop Resilience":               "Bioinputs",
    "Nature & Ecosystem Tech":                   "Nature Tech",
    "Farm Intelligence":                         "Farm Intel",
    "Biomaterials & Circular Economy":           "Biomaterials",
    "Biomanufacturing & Platform Technologies":  "Biomanufacturing",
    // legacy alias
    "Biomanufacturing & Fermentation Economy":   "Biomanufacturing",
  };
  const THEME_ORDER = Object.keys(THEME_PAL);
  const FLAG_MAP = {
    "Brazil":"🇧🇷","Brasil":"🇧🇷","BR":"🇧🇷",
    "Mexico":"🇲🇽","México":"🇲🇽","MX":"🇲🇽",
    "Colombia":"🇨🇴","CO":"🇨🇴",
    "Argentina":"🇦🇷","AR":"🇦🇷",
    "Chile":"🇨🇱","CL":"🇨🇱",
    "Peru":"🇵🇪","Perú":"🇵🇪","PE":"🇵🇪",
    "Uruguay":"🇺🇾","UY":"🇺🇾",
    "Costa Rica":"🇨🇷","CR":"🇨🇷",
    "Ecuador":"🇪🇨","EC":"🇪🇨",
    "Bolivia":"🇧🇴","BO":"🇧🇴",
    "Paraguay":"🇵🇾","PY":"🇵🇾",
    "Panama":"🇵🇦","Panamá":"🇵🇦","PA":"🇵🇦",
    "Guatemala":"🇬🇹","GT":"🇬🇹",
    "USA":"🇺🇸","US":"🇺🇸","United States":"🇺🇸",
  };

  // ── Hero stats ────────────────────────────────────────────────────────
  const funds    = D.nodes.filter(n => n.type === 'fund' || n.type === 'allocator' || n.investor_type);
  const bioInc   = D.nodes.filter(n => n.type === 'startup' && n.scope_decision === 'include');
  const funded   = bioInc.filter(n => n.capital_status === 'capital_mapped');
  const pubEdges = (D.edges||[]).filter(e => e.evidence_tier === 'public_url' || e.audited);
  const pct      = bioInc.length ? Math.round(funded.length / bioInc.length * 100) : 0;
  document.getElementById('stat-funds').textContent    = funds.length;
  document.getElementById('stat-funded').textContent   = funded.length + ' / ' + bioInc.length;
  document.getElementById('stat-coverage').textContent = pct + '%';
  document.getElementById('stat-edges').textContent    = pubEdges.length + ' / ' + (D.edges||[]).length;

  // ── Build investor stats from edges ───────────────────────────────────
  const nodeById = new Map(D.nodes.map(n => [n.id, n]));
  const bioIds   = new Set(bioInc.map(n => n.id));
  const invStats = {};

  (D.edges||[]).forEach(e => {
    if (!bioIds.has(e.target)) return;
    const inv     = nodeById.get(e.source);
    const startup = nodeById.get(e.target);
    if (!inv || !startup) return;
    if (!invStats[e.source]) {
      invStats[e.source] = {
        id: e.source,
        label: inv.label || inv.name || e.source,
        type:  inv.type || inv.investor_type || 'fund',
        subtype: inv.investor_subtype || '',
        count: 0,
        themes: {},
        countries: {},
        startups: [],
      };
    }
    const iv = invStats[e.source];
    iv.count++;
    const t = startup.theme;
    if (t && THEME_PAL[t]) iv.themes[t] = (iv.themes[t]||0)+1;
    (startup.countries||[startup.country]).filter(Boolean).forEach(c => {
      iv.countries[c] = (iv.countries[c]||0)+1;
    });
    iv.startups.push({
      id: startup.id,
      name: startup.label || startup.name || startup.id,
      theme: t,
      valuation_tier: startup.valuation_tier||0,
      degree: Number(startup.degree||startup.visible_degree||0),
      country: (startup.countries||[startup.country])[0]||'',
    });
  });

  const investors = Object.values(invStats)
    .sort((a,b) => b.count - a.count);

  document.getElementById('inv-head-sub').textContent =
    investors.length + ' fondos · ' + bioInc.length + ' startups include';

  // ── Render investor list ──────────────────────────────────────────────
  const listEl = document.getElementById('ca-inv-list');
  let activeInvId = null;

  function typeClass(type) {
    if (type === 'allocator') return 'iv-type-allocator';
    if (type === 'accelerator') return 'iv-type-accelerator';
    return 'iv-type-fund';
  }
  function typeLabel(type, subtype) {
    if (type === 'allocator') return 'Allocator';
    if (type === 'accelerator') return 'Aceleradora';
    if (subtype) return subtype.slice(0,12);
    return 'Fund';
  }

  function buildInvDetail(iv) {
    const topThemes = Object.entries(iv.themes)
      .sort((a,b)=>b[1]-a[1]).slice(0,5);
    const maxTheme  = topThemes[0]?.[1]||1;
    const topStartups = iv.startups
      .slice().sort((a,b) => b.valuation_tier - a.valuation_tier || b.degree - a.degree)
      .slice(0,8);

    let h = '';

    // Theme breakdown
    if (topThemes.length) {
      h += `<div class="iv-det-section">Portfolio por tema</div>`;
      topThemes.forEach(([t,n]) => {
        const col = THEME_PAL[t]||'#888';
        const pct = Math.round(n/iv.count*100);
        h += `<div style="margin-bottom:6px">
          <div style="display:flex;justify-content:space-between;font-size:.7rem;margin-bottom:2px">
            <span style="color:${col};font-weight:700">${THEME_SHORT[t]||t}</span>
            <span style="color:var(--muted)">${n} startup${n>1?'s':''} · ${pct}%</span>
          </div>
          <div class="iv-det-theme-bar"><span style="width:${pct}%;background:${col};opacity:.82"></span></div>
        </div>`;
      });
    }

    // Top startups
    if (topStartups.length) {
      h += `<div class="iv-det-section">Portfolio destacado</div>`;
      topStartups.forEach(s => {
        const col = THEME_PAL[s.theme]||'#888';
        const flag = FLAG_MAP[s.country]||'';
        const tier = s.valuation_tier>=2?'<span style="font-size:.6rem;color:var(--accent);font-weight:700;margin-left:3px">T'+s.valuation_tier+'</span>':'';
        h += `<div class="iv-det-row">
          <span style="display:flex;align-items:center;gap:5px;min-width:0">
            <span style="width:7px;height:7px;border-radius:50%;background:${col};flex-shrink:0"></span>
            <strong style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name}</strong>${tier}
          </span>
          <span style="white-space:nowrap;flex-shrink:0">${flag}</span>
        </div>`;
      });
    }

    return h;
  }

  function buildCard(iv) {
    const card = document.createElement('div');
    card.className = 'iv';
    card.dataset.id = iv.id;

    // Theme bar
    const barSegs = THEME_ORDER
      .filter(t => iv.themes[t])
      .map(t => `<div class="iv-theme-seg" style="width:${Math.round(iv.themes[t]/iv.count*100)}%;background:${THEME_PAL[t]};opacity:.84"></div>`)
      .join('');

    // Top 3 countries
    const topCountries = Object.entries(iv.countries)
      .sort((a,b)=>b[1]-a[1]).slice(0,3)
      .map(([c]) => `<span class="iv-country">${FLAG_MAP[c]||''} ${c}</span>`)
      .join('');

    // Dominant theme color for left border
    const domTheme = Object.entries(iv.themes).sort((a,b)=>b[1]-a[1])[0]?.[0];
    const domColor = domTheme ? THEME_PAL[domTheme] : '#aaa';

    card.style.setProperty('--iv-color', domColor);
    card.style.borderLeft = `3px solid ${domColor}`;

    const ivDom = iv.website ? (() => { try { return new URL(iv.website.startsWith('http') ? iv.website : 'https://'+iv.website).hostname.replace(/^www\./,''); } catch(e){ return null; }})() : null;
    const ivInitials = iv.label.split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
    const ivLogoHtml = ivDom
      ? `<img class="iv-logo" src="https://logo.clearbit.com/${ivDom}?size=128" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt=""><div class="iv-logo-ph" style="display:none">${ivInitials}</div>`
      : `<div class="iv-logo-ph">${ivInitials}</div>`;

    card.innerHTML = `
      <div class="iv-header">
        ${ivLogoHtml}
        <div class="iv-name-wrap">
          <div class="iv-name">${iv.label}</div>
          <div style="display:flex;gap:5px;align-items:center;margin-top:2px">
            <span class="iv-type-chip ${typeClass(iv.type)}">${typeLabel(iv.type, iv.subtype)}</span>
          </div>
        </div>
        <span class="iv-count">${iv.count}</span>
      </div>
      <div class="iv-preview">
        <div class="iv-theme-bar">${barSegs||'<div style="width:100%;background:#ddd;opacity:.4;height:100%"></div>'}</div>
        <div class="iv-countries">${topCountries}</div>
      </div>
      <div class="iv-detail">${buildInvDetail(iv)}</div>
    `;

    card.addEventListener('click', () => {
      setActiveInvestor(activeInvId === iv.id ? null : iv.id);
    });

    return card;
  }

  // Initial render
  function renderList(filter='') {
    listEl.innerHTML = '';
    const q = filter.toLowerCase().trim();
    const filtered = q
      ? investors.filter(iv => iv.label.toLowerCase().includes(q))
      : investors;
    if (!filtered.length) {
      listEl.innerHTML = `<div style="color:var(--muted);font-size:.76rem;padding:8px 4px">Sin resultados</div>`;
      return;
    }
    filtered.forEach(iv => listEl.appendChild(buildCard(iv)));
  }

  renderList();

  // Filter input
  document.getElementById('inv-filter').addEventListener('input', function() {
    renderList(this.value);
  });

  // ── View switching ──────────────────────────────────────────────────────
  let currentView = 'network';

  function switchView(view) {
    currentView = view;
    document.querySelectorAll('.vs-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.view === view));
    document.querySelectorAll('.ca-view').forEach(v =>
      v.classList.toggle('active', v.id === 'view-' + view));
    document.getElementById('net-controls').style.display =
      view === 'network' ? 'flex' : 'none';
    if (view === 'radial')  renderRadial(activeInvId);
    if (view === 'matrix')  renderMatrix();
    if (view === 'stages')  renderStageLadder();
    if (view === 'flow')    renderSankey();
  }

  document.querySelectorAll('.vs-btn').forEach(btn =>
    btn.addEventListener('click', () => switchView(btn.dataset.view)));

  // Radial hint acts as back button in focus mode
  document.getElementById('radial-hint').addEventListener('click', () => {
    if (activeInvId && currentView === 'radial') setActiveInvestor(null);
  });

  // ── Active investor coordinator ──────────────────────────────────────────
  function setActiveInvestor(id) {
    activeInvId = id;
    listEl.querySelectorAll('.iv').forEach(c =>
      c.classList.toggle('active', c.dataset.id === id));

    if (currentView === 'network') {
      if (window.AtlasAPI) {
        window.AtlasAPI.selectNode(id);
        if (id) window.AtlasAPI.zoomToInvestor(id);
        else     window.AtlasAPI.zoomReset();
      }
    } else if (currentView === 'radial') {
      renderRadial(id);
    } else if (currentView === 'matrix') {
      highlightMatrixRow(id);
    } else if (currentView === 'stages') {
      highlightStagesRow(id);
    }
  }

  // ── Radial view ──────────────────────────────────────────────────────────
  function renderRadial(selectedId) {
    const svg   = document.getElementById('radial-svg');
    const hint  = document.getElementById('radial-hint');
    const stage = document.querySelector('.ca-stage');
    const W = stage ? stage.clientWidth  : 800;
    const H = stage ? stage.clientHeight : 600;
    svg.innerHTML = '';

    if (!selectedId) {
      hint.style.cursor = 'default';
      hint.textContent  = 'Seleccioná un inversor para ver su portfolio en detalle';
      renderRadialOverview(svg, W, H);
    } else {
      const iv = invStats[selectedId];
      if (!iv) { renderRadialOverview(svg, W, H); return; }
      hint.style.cursor = 'pointer';
      hint.innerHTML = '← Volver · <strong>' + iv.label + '</strong> · ' + iv.count + ' startups';
      renderRadialFocus(svg, W, H, iv);
    }
  }

  function renderRadialOverview(svg, W, H) {
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

    const topInv = investors.slice(0, 32);
    const cx = W / 2, cy = H / 2;

    // Build bubble data with spiral initial placement
    const bubbles = topInv.map((iv, i) => {
      const domTheme = Object.entries(iv.themes).sort((a,b) => b[1]-a[1])[0]?.[0];
      const angle = i * 2.3998; // golden angle
      const rad   = Math.sqrt(i) * 36;
      return {
        id:    iv.id,
        label: iv.label,
        count: iv.count,
        r:     Math.max(16, Math.min(56, Math.sqrt(iv.count) * 10)),
        color: domTheme ? THEME_PAL[domTheme] : '#888',
        x: cx + Math.cos(angle) * rad,
        y: cy + Math.sin(angle) * rad,
        vx: 0, vy: 0,
      };
    });

    // Force relax — repulsion + centering
    for (let iter = 0; iter < 240; iter++) {
      const alpha = Math.pow(1 - iter / 240, 1.4);
      for (let i = 0; i < bubbles.length; i++) {
        for (let j = i + 1; j < bubbles.length; j++) {
          const dx = (bubbles[j].x - bubbles[i].x) || 0.01;
          const dy = (bubbles[j].y - bubbles[i].y) || 0.01;
          const dist = Math.sqrt(dx*dx + dy*dy);
          const minD = bubbles[i].r + bubbles[j].r + 5;
          if (dist < minD) {
            const f = (minD - dist) / dist * 0.44 * alpha;
            bubbles[i].vx -= dx * f; bubbles[i].vy -= dy * f;
            bubbles[j].vx += dx * f; bubbles[j].vy += dy * f;
          }
        }
        bubbles[i].vx += (cx - bubbles[i].x) * 0.012 * alpha;
        bubbles[i].vy += (cy - bubbles[i].y) * 0.012 * alpha;
      }
      bubbles.forEach(b => {
        b.x += b.vx; b.y += b.vy;
        b.vx *= 0.62; b.vy *= 0.62;
      });
    }

    const g = document.createElementNS(NS, 'g');
    bubbles.forEach(b => {
      const circle = document.createElementNS(NS, 'circle');
      circle.setAttribute('cx', b.x); circle.setAttribute('cy', b.y);
      circle.setAttribute('r', b.r);
      circle.setAttribute('fill', b.color + '22');
      circle.setAttribute('stroke', b.color);
      circle.setAttribute('stroke-width', '1.5');
      circle.style.cursor = 'pointer';
      circle.addEventListener('click', () => setActiveInvestor(b.id));
      circle.addEventListener('mouseenter', () => circle.setAttribute('fill', b.color + '50'));
      circle.addEventListener('mouseleave', () => circle.setAttribute('fill', b.color + '22'));
      g.appendChild(circle);

      const fsize = Math.max(8, Math.min(11, b.r * 0.30));
      const maxCh = Math.max(4, Math.floor(b.r * 0.22));
      const short  = b.label.length > maxCh ? b.label.slice(0, maxCh) + '…' : b.label;

      const t1 = document.createElementNS(NS, 'text');
      t1.setAttribute('x', b.x); t1.setAttribute('y', b.r >= 26 ? b.y - 4 : b.y);
      t1.setAttribute('text-anchor', 'middle'); t1.setAttribute('dominant-baseline', 'middle');
      t1.setAttribute('font-size', fsize); t1.setAttribute('font-weight', '700');
      t1.setAttribute('font-family', 'inherit'); t1.setAttribute('fill', b.color);
      t1.setAttribute('pointer-events', 'none');
      t1.textContent = short;
      g.appendChild(t1);

      if (b.r >= 26) {
        const t2 = document.createElementNS(NS, 'text');
        t2.setAttribute('x', b.x); t2.setAttribute('y', b.y + fsize + 1);
        t2.setAttribute('text-anchor', 'middle'); t2.setAttribute('dominant-baseline', 'middle');
        t2.setAttribute('font-size', Math.max(7, fsize - 2)); t2.setAttribute('font-weight', '600');
        t2.setAttribute('font-family', 'inherit'); t2.setAttribute('fill', b.color);
        t2.setAttribute('opacity', '0.68'); t2.setAttribute('pointer-events', 'none');
        t2.textContent = b.count;
        g.appendChild(t2);
      }
    });
    svg.appendChild(g);
  }

  function renderRadialFocus(svg, W, H, iv) {
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    const cx = W / 2, cy = H / 2;
    const innerR = 52;
    const outerR = Math.min(W, H) * 0.36;

    // Group startups by theme
    const byTheme = {};
    iv.startups.forEach(s => {
      const t = s.theme || '—';
      if (!byTheme[t]) byTheme[t] = [];
      byTheme[t].push(s);
    });
    const themes = Object.keys(byTheme).sort((a,b) => byTheme[b].length - byTheme[a].length);
    const total  = iv.startups.length;

    const g = document.createElementNS(NS, 'g');
    let angleStart = -Math.PI / 2;

    themes.forEach(theme => {
      const count  = byTheme[theme].length;
      const sweep  = (count / total) * Math.PI * 2;
      const midA   = angleStart + sweep / 2;
      const color  = THEME_PAL[theme] || '#888';
      const large  = sweep > Math.PI ? 1 : 0;
      const r1 = outerR - 24, r2 = outerR + 22;

      // Annular sector
      const c0 = Math.cos(angleStart), s0 = Math.sin(angleStart);
      const c1 = Math.cos(angleStart + sweep), s1 = Math.sin(angleStart + sweep);
      const d = [
        'M', cx+c0*r1, cy+s0*r1,
        'A', r1, r1, 0, large, 1, cx+c1*r1, cy+s1*r1,
        'L', cx+c1*r2, cy+s1*r2,
        'A', r2, r2, 0, large, 0, cx+c0*r2, cy+s0*r2,
        'Z',
      ].join(' ');
      const sector = document.createElementNS(NS, 'path');
      sector.setAttribute('d', d);
      sector.setAttribute('fill', color + '1e');
      sector.setAttribute('stroke', color + '4a');
      sector.setAttribute('stroke-width', '0.8');
      g.appendChild(sector);

      // Theme label
      const tl = document.createElementNS(NS, 'text');
      tl.setAttribute('x', cx + Math.cos(midA) * (r2 + 16));
      tl.setAttribute('y', cy + Math.sin(midA) * (r2 + 16));
      tl.setAttribute('text-anchor', 'middle'); tl.setAttribute('dominant-baseline', 'middle');
      tl.setAttribute('font-size', '9'); tl.setAttribute('font-weight', '700');
      tl.setAttribute('font-family', 'inherit'); tl.setAttribute('fill', color);
      tl.setAttribute('pointer-events', 'none');
      tl.textContent = THEME_SHORT[theme] || theme.split(' ')[0];
      g.appendChild(tl);

      // Startup dots + labels
      byTheme[theme].forEach((s, i) => {
        const a  = angleStart + (i + 0.5) / count * sweep;
        const sx = cx + Math.cos(a) * outerR;
        const sy = cy + Math.sin(a) * outerR;

        const line = document.createElementNS(NS, 'line');
        line.setAttribute('x1', cx); line.setAttribute('y1', cy);
        line.setAttribute('x2', sx); line.setAttribute('y2', sy);
        line.setAttribute('stroke', color); line.setAttribute('stroke-width', '0.7');
        line.setAttribute('opacity', '0.22');
        g.appendChild(line);

        const dot = document.createElementNS(NS, 'circle');
        dot.setAttribute('cx', sx); dot.setAttribute('cy', sy); dot.setAttribute('r', 5);
        dot.setAttribute('fill', color); dot.setAttribute('opacity', '0.76');
        g.appendChild(dot);

        if (count <= 18 || s.valuation_tier >= 2) {
          const anchor = Math.cos(a) >= 0 ? 'start' : 'end';
          const st = document.createElementNS(NS, 'text');
          st.setAttribute('x', sx + Math.cos(a) * 9);
          st.setAttribute('y', sy + Math.sin(a) * 9);
          st.setAttribute('text-anchor', anchor); st.setAttribute('dominant-baseline', 'middle');
          st.setAttribute('font-size', '7.5'); st.setAttribute('font-family', 'inherit');
          st.setAttribute('fill', color); st.setAttribute('opacity', '0.82');
          st.setAttribute('pointer-events', 'none');
          const nm = s.name.length > 20 ? s.name.slice(0, 18) + '…' : s.name;
          st.textContent = nm;
          g.appendChild(st);
        }
      });

      angleStart += sweep;
    });

    // Center glow
    const domTheme = Object.entries(iv.themes).sort((a,b) => b[1]-a[1])[0]?.[0];
    const domColor = domTheme ? THEME_PAL[domTheme] : '#3AA8A3';

    const glow = document.createElementNS(NS, 'circle');
    glow.setAttribute('cx', cx); glow.setAttribute('cy', cy); glow.setAttribute('r', innerR + 10);
    glow.setAttribute('fill', domColor + '14');
    glow.setAttribute('stroke', domColor + '35'); glow.setAttribute('stroke-width', '1');
    g.appendChild(glow);

    const center = document.createElementNS(NS, 'circle');
    center.setAttribute('cx', cx); center.setAttribute('cy', cy); center.setAttribute('r', innerR);
    center.setAttribute('fill', domColor + '1e');
    center.setAttribute('stroke', domColor); center.setAttribute('stroke-width', '2');
    g.appendChild(center);

    // Name (word-wrapped inside circle)
    const words = iv.label.split(' ');
    const lines = []; let cur = '';
    words.forEach(w => {
      const test = cur ? cur + ' ' + w : w;
      if (test.length > 10 && cur) { lines.push(cur); cur = w; }
      else cur = test;
    });
    if (cur) lines.push(cur);
    const lineH = 13, nameLines = lines.slice(0, 3);
    const nameStartY = cy - (nameLines.length - 1) * lineH / 2;
    nameLines.forEach((line, li) => {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', cx); t.setAttribute('y', nameStartY + li * lineH);
      t.setAttribute('text-anchor', 'middle'); t.setAttribute('dominant-baseline', 'middle');
      t.setAttribute('font-size', '11'); t.setAttribute('font-weight', '800');
      t.setAttribute('font-family', 'inherit'); t.setAttribute('fill', domColor);
      t.setAttribute('pointer-events', 'none');
      t.textContent = line;
      g.appendChild(t);
    });

    const ct = document.createElementNS(NS, 'text');
    ct.setAttribute('x', cx); ct.setAttribute('y', nameStartY + nameLines.length * lineH + 1);
    ct.setAttribute('text-anchor', 'middle'); ct.setAttribute('dominant-baseline', 'middle');
    ct.setAttribute('font-size', '9'); ct.setAttribute('font-family', 'inherit');
    ct.setAttribute('fill', domColor); ct.setAttribute('opacity', '0.62');
    ct.setAttribute('pointer-events', 'none');
    ct.textContent = iv.count + ' startups';
    g.appendChild(ct);

    svg.appendChild(g);
  }

  // ── Matrix view ──────────────────────────────────────────────────────────
  let matrixHighlighted = null;

  function renderMatrix() {
    const view  = document.getElementById('view-matrix');
    const svg   = document.getElementById('matrix-svg');
    const stage = document.querySelector('.ca-stage');
    svg.innerHTML = '';
    matrixHighlighted = null;
    view.style.overflow = 'hidden';

    // ── Dimensions: fill the stage exactly ──────────────────────────────
    const PAD    = 14;   // outer margin
    const W      = (stage ? stage.clientWidth  : 900) - PAD * 2;
    const H      = (stage ? stage.clientHeight : 600) - PAD * 2;
    const HEADER = 40;   // header row height
    const labelW = 148;  // investor name column
    const nTheme = THEME_ORDER.length;
    const colW   = Math.floor((W - labelW) / nTheme);
    // How many investors we can fit cleanly
    const maxRows  = Math.max(1, Math.floor((H - HEADER) / 22));
    const minRowH  = 19, maxRowH = 32;
    const topInv   = investors.slice(0, Math.min(maxRows, investors.length));
    const nRows    = Math.max(1, topInv.length);
    const rowH     = Math.max(minRowH, Math.min(maxRowH, Math.floor((H - HEADER) / nRows)));
    const gridW    = labelW + nTheme * colW;
    const gridH    = HEADER + topInv.length * rowH;
    const totalW   = gridW + PAD * 2;
    const totalH   = gridH + PAD * 2;

    svg.setAttribute('width',  totalW);
    svg.setAttribute('height', totalH);
    svg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);
    svg.style.width  = totalW + 'px';
    svg.style.height = totalH + 'px';
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

    const g = document.createElementNS(NS, 'g');
    g.setAttribute('transform', `translate(${PAD},${PAD})`);

    // ── Background panel ────────────────────────────────────────────────
    const panelBg = document.createElementNS(NS, 'rect');
    panelBg.setAttribute('x', 0); panelBg.setAttribute('y', 0);
    panelBg.setAttribute('width', gridW); panelBg.setAttribute('height', gridH);
    panelBg.setAttribute('rx', '10');
    panelBg.setAttribute('fill', 'rgba(255,252,246,.72)');
    panelBg.setAttribute('stroke', 'rgba(217,206,190,.42)');
    panelBg.setAttribute('stroke-width', '1');
    g.appendChild(panelBg);

    // ── Column headers (horizontal, colored pill background) ────────────
    // Header bg strip
    const hdrBg = document.createElementNS(NS, 'rect');
    hdrBg.setAttribute('x', labelW); hdrBg.setAttribute('y', 0);
    hdrBg.setAttribute('width', nTheme * colW); hdrBg.setAttribute('height', HEADER);
    hdrBg.setAttribute('rx', '0'); hdrBg.setAttribute('fill', 'rgba(240,234,222,.55)');
    g.appendChild(hdrBg);

    THEME_ORDER.forEach((theme, ci) => {
      const x   = labelW + ci * colW;
      const col = THEME_PAL[theme];
      const lbl = THEME_SHORT[theme] || theme.split(' ')[0];
      // Colored indicator bar at top of each column header
      const bar = document.createElementNS(NS, 'rect');
      bar.setAttribute('x', x + 2); bar.setAttribute('y', 0);
      bar.setAttribute('width', colW - 4); bar.setAttribute('height', 3);
      bar.setAttribute('rx', '1.5');
      bar.setAttribute('fill', col);
      g.appendChild(bar);
      // Vertical divider
      if (ci > 0) {
        const vd = document.createElementNS(NS, 'line');
        vd.setAttribute('x1', x); vd.setAttribute('y1', 0);
        vd.setAttribute('x2', x); vd.setAttribute('y2', HEADER);
        vd.setAttribute('stroke', 'rgba(217,206,190,.3)'); vd.setAttribute('stroke-width', '0.5');
        g.appendChild(vd);
      }
      // Theme label — two-line if needed
      const words = lbl.split(' ');
      const line1 = words[0];
      const line2 = words.slice(1).join(' ');
      const fontSize = colW >= 72 ? 9.5 : 8.5;
      const t1 = document.createElementNS(NS, 'text');
      t1.setAttribute('x', x + colW / 2);
      t1.setAttribute('y', line2 ? HEADER / 2 - 1 : HEADER / 2 + 4);
      t1.setAttribute('text-anchor', 'middle');
      t1.setAttribute('dominant-baseline', line2 ? 'auto' : 'middle');
      t1.setAttribute('font-size', fontSize);
      t1.setAttribute('font-weight', '800');
      t1.setAttribute('font-family', 'inherit');
      t1.setAttribute('fill', col);
      t1.setAttribute('pointer-events', 'none');
      t1.textContent = line1;
      g.appendChild(t1);
      if (line2) {
        const t2 = document.createElementNS(NS, 'text');
        t2.setAttribute('x', x + colW / 2);
        t2.setAttribute('y', HEADER / 2 + 9);
        t2.setAttribute('text-anchor', 'middle');
        t2.setAttribute('font-size', fontSize - 0.5);
        t2.setAttribute('font-weight', '700');
        t2.setAttribute('font-family', 'inherit');
        t2.setAttribute('fill', col);
        t2.setAttribute('opacity', '0.82');
        t2.setAttribute('pointer-events', 'none');
        t2.textContent = line2;
        g.appendChild(t2);
      }
    });

    // Header/body separator
    const hdrLine = document.createElementNS(NS, 'line');
    hdrLine.setAttribute('x1', 0); hdrLine.setAttribute('y1', HEADER);
    hdrLine.setAttribute('x2', gridW); hdrLine.setAttribute('y2', HEADER);
    hdrLine.setAttribute('stroke', 'rgba(217,206,190,.55)'); hdrLine.setAttribute('stroke-width', '1');
    g.appendChild(hdrLine);

    // Label column header
    const lblHead = document.createElementNS(NS, 'text');
    lblHead.setAttribute('x', 10); lblHead.setAttribute('y', HEADER / 2 + 1);
    lblHead.setAttribute('dominant-baseline', 'middle');
    lblHead.setAttribute('font-size', '8.5'); lblHead.setAttribute('font-weight', '800');
    lblHead.setAttribute('font-family', 'inherit');
    lblHead.setAttribute('fill', 'rgba(90,78,62,.55)');
    lblHead.setAttribute('letter-spacing', '0.08em');
    lblHead.setAttribute('pointer-events', 'none');
    lblHead.textContent = `${topInv.length} INVERSORES`;
    g.appendChild(lblHead);

    // ── Per-theme max for relative opacity ──────────────────────────────
    const themeMaxes = {};
    THEME_ORDER.forEach(t => {
      themeMaxes[t] = Math.max(1, ...topInv.map(iv => iv.themes[t] || 0));
    });

    // ── Investor rows ────────────────────────────────────────────────────
    topInv.forEach((iv, ri) => {
      const y  = HEADER + ri * rowH;
      const rg = document.createElementNS(NS, 'g');
      rg.setAttribute('data-inv', iv.id);
      rg.style.cursor = 'pointer';

      // Row background (transparent by default, colored on hover/select)
      const bg = document.createElementNS(NS, 'rect');
      bg.setAttribute('x', 0); bg.setAttribute('y', y);
      bg.setAttribute('width', gridW); bg.setAttribute('height', rowH);
      bg.setAttribute('fill', 'transparent');
      rg.appendChild(bg);

      // Investor name
      const lbl = document.createElementNS(NS, 'text');
      lbl.setAttribute('x', 9); lbl.setAttribute('y', y + rowH / 2);
      lbl.setAttribute('dominant-baseline', 'middle');
      lbl.setAttribute('font-size', rowH >= 26 ? '10' : '9');
      lbl.setAttribute('font-weight', '700');
      lbl.setAttribute('font-family', 'inherit');
      lbl.setAttribute('fill', '#332b22');
      const maxLblChars = Math.floor(labelW / 6.8);
      lbl.textContent = iv.label.length > maxLblChars ? iv.label.slice(0, maxLblChars - 1) + '…' : iv.label;
      rg.appendChild(lbl);

      // Total count badge (right edge of label column)
      const total = THEME_ORDER.reduce((s, t) => s + (iv.themes[t] || 0), 0);
      if (total > 0) {
        const badge = document.createElementNS(NS, 'text');
        badge.setAttribute('x', labelW - 5); badge.setAttribute('y', y + rowH / 2);
        badge.setAttribute('text-anchor', 'end'); badge.setAttribute('dominant-baseline', 'middle');
        badge.setAttribute('font-size', '7.5'); badge.setAttribute('font-weight', '800');
        badge.setAttribute('font-family', 'inherit');
        badge.setAttribute('fill', 'rgba(90,78,62,.42)');
        badge.setAttribute('pointer-events', 'none');
        badge.textContent = total;
        rg.appendChild(badge);
      }

      // Label column right border
      const lblBorder = document.createElementNS(NS, 'line');
      lblBorder.setAttribute('x1', labelW); lblBorder.setAttribute('y1', y);
      lblBorder.setAttribute('x2', labelW); lblBorder.setAttribute('y2', y + rowH);
      lblBorder.setAttribute('stroke', 'rgba(217,206,190,.28)'); lblBorder.setAttribute('stroke-width', '0.5');
      rg.appendChild(lblBorder);

      // Theme cells
      THEME_ORDER.forEach((theme, ci) => {
        const count = iv.themes[theme] || 0;
        const cx    = labelW + ci * colW;
        const color = THEME_PAL[theme];

        const cell = document.createElementNS(NS, 'rect');
        cell.setAttribute('x', cx + 2); cell.setAttribute('y', y + 2);
        cell.setAttribute('width', colW - 4); cell.setAttribute('height', rowH - 4);
        cell.setAttribute('rx', '4');
        if (count === 0) {
          cell.setAttribute('fill', 'rgba(210,200,185,.09)');
        } else {
          const ratio = count / themeMaxes[theme];
          const op = 0.13 + ratio * 0.74;
          cell.setAttribute('fill', color);
          cell.setAttribute('opacity', String(op));
        }
        rg.appendChild(cell);

        if (count > 0 && colW >= 28) {
          const ratio   = count / themeMaxes[theme];
          const darkBg  = ratio > 0.52;
          const ct = document.createElementNS(NS, 'text');
          ct.setAttribute('x', cx + colW / 2); ct.setAttribute('y', y + rowH / 2);
          ct.setAttribute('text-anchor', 'middle'); ct.setAttribute('dominant-baseline', 'middle');
          ct.setAttribute('font-size', rowH >= 26 ? '8.5' : '7.5');
          ct.setAttribute('font-weight', '800');
          ct.setAttribute('font-family', 'inherit');
          ct.setAttribute('fill', darkBg ? '#fff' : color);
          ct.setAttribute('pointer-events', 'none');
          ct.textContent = count;
          rg.appendChild(ct);
        }
      });

      rg.addEventListener('click', () =>
        setActiveInvestor(activeInvId === iv.id ? null : iv.id));

      rg.addEventListener('mouseenter', () => {
        if (matrixHighlighted !== iv.id) {
          bg.setAttribute('fill', 'rgba(58,168,163,.07)');
          lbl.setAttribute('fill', '#0a6b63');
        }
      });
      rg.addEventListener('mouseleave', () => {
        if (matrixHighlighted !== iv.id) {
          bg.setAttribute('fill', 'transparent');
          lbl.setAttribute('fill', '#332b22');
        }
      });

      g.appendChild(rg);
    });

    // ── Row dividers ────────────────────────────────────────────────────
    for (let ri = 1; ri < topInv.length; ri++) {
      const y = HEADER + ri * rowH;
      const d = document.createElementNS(NS, 'line');
      d.setAttribute('x1', 0); d.setAttribute('y1', y);
      d.setAttribute('x2', gridW); d.setAttribute('y2', y);
      d.setAttribute('stroke', 'rgba(217,206,190,.18)'); d.setAttribute('stroke-width', '0.5');
      g.insertBefore(d, g.firstChild);
    }

    // ── Column vertical dividers through rows ───────────────────────────
    THEME_ORDER.forEach((_, ci) => {
      if (ci === 0) return;
      const x = labelW + ci * colW;
      const vd = document.createElementNS(NS, 'line');
      vd.setAttribute('x1', x); vd.setAttribute('y1', HEADER);
      vd.setAttribute('x2', x); vd.setAttribute('y2', gridH);
      vd.setAttribute('stroke', 'rgba(217,206,190,.18)'); vd.setAttribute('stroke-width', '0.5');
      g.insertBefore(vd, g.firstChild);
    });

    svg.appendChild(g);
  }

  function highlightMatrixRow(id) {
    matrixHighlighted = id;
    const svg = document.getElementById('matrix-svg');
    svg.querySelectorAll('[data-inv]').forEach(rg => {
      const isA = rg.dataset.inv === id;
      const bg  = rg.querySelector('rect');
      const lbl = rg.querySelector('text');
      if (bg)  bg.setAttribute('fill',  isA ? 'rgba(58,168,163,.10)' : 'transparent');
      if (lbl) lbl.setAttribute('fill', isA ? '#0a6b63' : '#332b22');
    });
  }

  // ── Stage Ladder view ─────────────────────────────────────────────────────
  const STAGE_ORDER = ['pre-seed','seed','series-a','series-b','series-c','growth','corporate'];
  const STAGE_LABEL = {'pre-seed':'Pre-seed','seed':'Seed','series-a':'A','series-b':'B',
                       'series-c':'C','growth':'Growth','corporate':'Corp'};

  let slSortCol = 'deals', slSortDir = -1;
  let slFundThemeMap = {};   // investor_id → {theme: deal_count}

  // which stages are "latam-core" (no Series C+ locally)
  const STAGE_GAP_START = 'series-b'; // highlight gap from here

  // type label display
  function typeLabel(t) {
    const m = {vc:'VC',accelerator:'Aceleradora',impact_fund:'Impacto',corporate_vc:'Corp VC',
               company_builder:'Builder',fund_of_funds:'FoF',multilateral:'Multilateral',
               development_finance:'Dev Finance'};
    return m[t] || t;
  }

  function fmtAum(v) {
    if (!v) return '';
    if (v >= 1000) return '$' + (v/1000).toFixed(1) + 'B';
    return '$' + Math.round(v) + 'M';
  }

  function renderStageLadder() {
    const wrap = document.getElementById('stages-wrap');
    wrap.innerHTML = '';

    // Left column container
    const left = document.createElement('div');
    left.className = 'sl-left';
    wrap.appendChild(left);

    // Profile card — always present as right column
    const card = document.createElement('div');
    card.id = 'fund-profile-card';
    card.innerHTML = `<div class="fp-placeholder"><span class="fp-placeholder-icon">↖</span><span>Hacé click en un fondo<br>para ver su ficha</span></div>`;
    wrap.appendChild(card);

    const allFundNodes = D.nodes.filter(n =>
      (n.type === 'fund' || n.type === 'allocator') && n.stages && n.stages.length > 0
    );

    const gapStages = ['series-b','series-c','growth'];
    const gapFunds = allFundNodes.filter(n => n.stages.some(s => gapStages.includes(s)));

    // Title
    const title = document.createElement('div');
    title.className = 'sl-title';
    title.textContent = 'Cobertura de etapas — ' + allFundNodes.length + ' fondos';
    left.appendChild(title);

    // Legend
    const legend = document.createElement('div');
    legend.className = 'sl-legend';
    legend.innerHTML = `
      <span class="sl-legend-item"><span class="sl-legend-dot" style="background:var(--accent)"></span> Etapa declarada</span>
      <span class="sl-legend-item"><span class="sl-legend-dot" style="background:rgba(160,152,140,.22);border:1.5px solid rgba(160,152,140,.35)"></span> No cubre</span>
      <span class="sl-legend-item" style="margin-left:12px;color:#C25A2A;font-weight:600">⚠ Series B+ — solo ${gapFunds.length} fondos cubren etapas tardías</span>
    `;
    left.appendChild(legend);

    // Build module-level fund → theme deal map
    slFundThemeMap = {};
    if (D.capital_flow) {
      D.capital_flow.fund_theme.forEach(ft => {
        if (!slFundThemeMap[ft.source]) slFundThemeMap[ft.source] = {};
        slFundThemeMap[ft.source][ft.theme] = ft.deal_count;
      });
    }

    // Table
    const tbl = document.createElement('table');
    tbl.className = 'sl-grid';

    // Header — sortable columns
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');

    function makeTh(label, sortKey, extra) {
      const th = document.createElement('th');
      if (extra && extra.className) th.className = extra.className;
      if (extra && extra.style) Object.assign(th.style, extra.style);
      th.style.cursor = 'pointer';
      th.style.userSelect = 'none';
      th.dataset.sortKey = sortKey;
      if (extra && extra.isGap) {
        th.style.color = '#C25A2A';
        th.style.borderBottom = '1.5px solid rgba(194,90,42,.4)';
      }
      function updateLabel() {
        const arrow = slSortCol === sortKey ? (slSortDir === -1 ? ' ↓' : ' ↑') : '';
        th.textContent = label + arrow;
        if (extra && extra.isGap && slSortCol !== sortKey) th.style.color = '#C25A2A';
      }
      updateLabel();
      th.addEventListener('click', () => {
        if (slSortCol === sortKey) { slSortDir *= -1; }
        else { slSortCol = sortKey; slSortDir = -1; }
        // Refresh all th labels
        hr.querySelectorAll('th[data-sort-key]').forEach(t => {
          const sk = t.dataset.sortKey;
          const lbl = t.dataset.label;
          const isGap = t.dataset.gap === '1';
          const arrow = slSortCol === sk ? (slSortDir === -1 ? ' ↓' : ' ↑') : '';
          t.textContent = lbl + arrow;
          if (isGap && slSortCol !== sk) t.style.color = '#C25A2A';
          else if (isGap && slSortCol === sk) t.style.color = '';
        });
        refreshStageLadderBody(allFundNodes, tbody, gapStages);
        highlightStagesRow(activeInvId);
      });
      th.dataset.label = label;
      if (extra && extra.isGap) th.dataset.gap = '1';
      return th;
    }

    hr.appendChild(makeTh('Fondo', 'name', {className: 'sl-name-col'}));
    hr.appendChild(makeTh('Tipo', 'type'));
    hr.appendChild(makeTh('AUM', 'aum'));
    hr.appendChild(makeTh('Deals', 'deals'));
    STAGE_ORDER.forEach(s => {
      hr.appendChild(makeTh(STAGE_LABEL[s], 'stage:' + s, {isGap: gapStages.includes(s)}));
    });
    hr.appendChild(makeTh('Verticales', 'verticals', {style: {textAlign: 'left'}}));

    thead.appendChild(hr);
    tbl.appendChild(thead);

    const tbody = document.createElement('tbody');
    refreshStageLadderBody(allFundNodes, tbody, gapStages);
    tbl.appendChild(tbody);
    left.appendChild(tbl);

    // Gap insight banner
    const banner = document.createElement('div');
    banner.className = 'sl-gap-banner';
    const lateStageNames = gapFunds.map(f => f.label).join(', ');
    banner.innerHTML = `<strong>Brecha estructural detectada:</strong> Solo <strong>${gapFunds.length} fondos</strong> declaran cobertura en Series B o posterior
      — ${lateStageNames || 'ninguno'}.
      El ecosistema BIO LATAM carece de capital de crecimiento local: las empresas que superan Series A deben buscar capital fuera de la región.`;
    left.appendChild(banner);
  }

  function refreshStageLadderBody(allFundNodes, tbody, gapStages) {
    // Dynamic sort
    const nodes = allFundNodes.slice();
    nodes.sort((a, b) => {
      let va, vb;
      if (slSortCol === 'name') {
        va = (a.label||'').toLowerCase(); vb = (b.label||'').toLowerCase();
        return slSortDir * (va < vb ? -1 : va > vb ? 1 : 0);
      } else if (slSortCol === 'type') {
        va = (a.investor_type||'').toLowerCase(); vb = (b.investor_type||'').toLowerCase();
        return slSortDir * (va < vb ? -1 : va > vb ? 1 : 0);
      } else if (slSortCol === 'aum') {
        va = a.aum_m || 0; vb = b.aum_m || 0;
        return slSortDir * (va - vb);
      } else if (slSortCol === 'deals') {
        va = a.degree || 0; vb = b.degree || 0;
        return slSortDir * (va - vb);
      } else if (slSortCol === 'verticals') {
        va = (a.verticals||[]).length; vb = (b.verticals||[]).length;
        return slSortDir * (va - vb);
      } else if (slSortCol.startsWith('stage:')) {
        const s = slSortCol.slice(6);
        va = (a.stages||[]).map(x=>x.toLowerCase()).includes(s) ? 1 : 0;
        vb = (b.stages||[]).map(x=>x.toLowerCase()).includes(s) ? 1 : 0;
        if (va !== vb) return slSortDir * (va - vb);
        // secondary: name asc
        return (a.label||'').localeCompare(b.label||'');
      }
      return 0;
    });

    tbody.innerHTML = '';
    nodes.forEach(n => {
      const tr = document.createElement('tr');
      tr.dataset.id = n.id;

      const tdName = document.createElement('td');
      tdName.className = 'sl-name-col';
      tdName.title = n.label;
      const flag = n.country ? '  ' + countryFlag(n.country) : '';
      tdName.textContent = n.label + flag;
      tdName.style.cursor = 'pointer';
      tdName.addEventListener('click', () => setActiveInvestor(n.id === activeInvId ? null : n.id));
      tr.appendChild(tdName);

      const tdType = document.createElement('td');
      tdType.className = 'sl-center';
      const badge = document.createElement('span');
      badge.className = 'sl-badge sl-type-' + (n.investor_type||'');
      badge.textContent = typeLabel(n.investor_type||'');
      tdType.appendChild(badge);
      tr.appendChild(tdType);

      const tdAum = document.createElement('td');
      tdAum.className = 'sl-aum sl-center';
      tdAum.textContent = fmtAum(n.aum_m);
      tr.appendChild(tdAum);

      const tdDeals = document.createElement('td');
      tdDeals.className = 'sl-center';
      tdDeals.style.fontWeight = '700';
      tdDeals.style.fontSize = '.78rem';
      tdDeals.style.color = n.degree > 0 ? 'var(--accent)' : 'var(--muted)';
      tdDeals.textContent = n.degree || '—';
      tr.appendChild(tdDeals);

      const stageSet = new Set((n.stages||[]).map(s => s.toLowerCase()));
      STAGE_ORDER.forEach(s => {
        const td = document.createElement('td');
        td.className = 'sl-center';
        const dot = document.createElement('span');
        const covered = stageSet.has(s);
        dot.className = 'sl-dot ' + (covered ? 'core' : 'empty');
        if (covered && gapStages.includes(s)) dot.style.background = '#C25A2A';
        td.appendChild(dot);
        tr.appendChild(td);
      });

      const tdVert = document.createElement('td');
      tdVert.style.minWidth = '120px';
      tdVert.style.paddingLeft = '6px';
      const themeEntries = Object.entries(slFundThemeMap[n.id] || {})
        .sort((a,b) => b[1] - a[1]);
      const themeTotal = themeEntries.reduce((s,[,c]) => s+c, 0);
      if (themeTotal > 0) {
        const bar = document.createElement('div');
        bar.className = 'sl-theme-bar';
        themeEntries.forEach(([theme, count]) => {
          const seg = document.createElement('div');
          seg.style.width = (count / themeTotal * 100) + '%';
          seg.style.background = THEME_PAL[theme] || '#aaa';
          seg.title = (THEME_SHORT[theme]||theme) + ': ' + count;
          bar.appendChild(seg);
        });
        const tags = document.createElement('div');
        tags.className = 'sl-theme-tags';
        themeEntries.slice(0, 3).forEach(([theme]) => {
          const col = THEME_PAL[theme] || '#aaa';
          const tag = document.createElement('span');
          tag.className = 'sl-theme-tag';
          tag.style.background = col + '1a';
          tag.style.color = col;
          tag.textContent = THEME_SHORT[theme] || theme.split(' ')[0];
          tags.appendChild(tag);
        });
        tdVert.appendChild(bar);
        tdVert.appendChild(tags);
      } else {
        tdVert.textContent = '—';
        tdVert.style.color = 'var(--muted)';
        tdVert.style.fontSize = '.72rem';
        tdVert.style.textAlign = 'center';
      }
      tr.appendChild(tdVert);

      tbody.appendChild(tr);
    });
  }

  function highlightStagesRow(id) {
    const wrap = document.getElementById('stages-wrap');
    if (!wrap) return;
    wrap.querySelectorAll('tr[data-id]').forEach(tr => {
      tr.style.background = (tr.dataset.id === id) ? 'rgba(11,143,135,.07)' : '';
    });
    renderFundProfile(id);
  }

  function countryName(iso) {
    const m = {AR:'Argentina',BR:'Brasil',CL:'Chile',CO:'Colombia',MX:'México',PE:'Perú',
               UY:'Uruguay',CR:'Costa Rica',EC:'Ecuador',BO:'Bolivia',PY:'Paraguay',
               PA:'Panamá',GT:'Guatemala',US:'Estados Unidos',GB:'Reino Unido',
               FR:'Francia',DE:'Alemania',IL:'Israel',SG:'Singapur',CA:'Canadá'};
    return m[(iso||'').toUpperCase()] || iso || '';
  }

  function renderFundProfile(id) {
    const card = document.getElementById('fund-profile-card');
    if (!card) return;
    if (!id) {
      card.innerHTML = `<div class="fp-placeholder"><span class="fp-placeholder-icon">↖</span><span>Hacé click en un fondo<br>para ver su ficha</span></div>`;
      return;
    }

    const n = D.nodes.find(x => x.id === id);
    if (!n) { card.className = ''; return; }

    const themes = Object.entries(slFundThemeMap[id] || {}).sort((a,b) => b[1]-a[1]);
    const total  = themes.reduce((s,[,c]) => s+c, 0);
    // Use curated blurb if available, else auto-generate
    const paragraphs = n.profile_blurb
      ? n.profile_blurb.split('\n\n').filter(p => p.trim())
      : buildFundProfile(n, themes, total);

    const flag = n.country ? countryFlag(n.country) : '';
    const cname = countryName(n.country);

    // Stages summary
    const stages = (n.stages||[]).map(s => STAGE_LABEL[s]||s).join(' · ') || '—';

    // Ticket range
    let ticket = '—';
    if (n.ticket_min || n.ticket_max) {
      const fmtK = v => v >= 1e6 ? '$'+(v/1e6).toFixed(1)+'M' : '$'+(v/1e3)+'K';
      ticket = (n.ticket_min ? fmtK(n.ticket_min) : '?') + ' – ' + (n.ticket_max ? fmtK(n.ticket_max) : '?');
    }

    let html = `<div class="fp-header">
      <span class="fp-flag">${flag}</span>
      <span class="fp-name">${n.label}</span>
      <span class="sl-badge sl-type-${n.investor_type||''}" style="font-size:.7rem">${typeLabel(n.investor_type||'')}</span>
    </div>
    <div class="fp-stats">
      ${cname ? `<div class="fp-stat"><div class="fp-stat-label">País</div><div class="fp-stat-value">${cname}</div></div>` : ''}
      ${n.aum_m ? `<div class="fp-stat"><div class="fp-stat-label">AUM</div><div class="fp-stat-value">${fmtAum(n.aum_m)}</div></div>` : ''}
      <div class="fp-stat"><div class="fp-stat-label">Deals BIO</div><div class="fp-stat-value">${n.degree || '0'}</div></div>
      <div class="fp-stat"><div class="fp-stat-label">Etapas</div><div class="fp-stat-value" style="font-size:.72rem">${stages}</div></div>
      ${ticket !== '—' ? `<div class="fp-stat"><div class="fp-stat-label">Ticket</div><div class="fp-stat-value">${ticket}</div></div>` : ''}
      ${n.lead_behavior ? `<div class="fp-stat"><div class="fp-stat-label">Rol en ronda</div><div class="fp-stat-value">${n.lead_behavior==='lead'?'Lead investor':n.lead_behavior==='follow'?'Co-inversor':'Lead / Co'}</div></div>` : ''}
    </div>`;

    if (total > 0) {
      html += `<div class="fp-theme-section">
        <div class="fp-theme-bar-lg">`;
      themes.forEach(([theme, count]) => {
        html += `<div style="width:${(count/total*100).toFixed(1)}%;background:${THEME_PAL[theme]||'#aaa'}" title="${THEME_SHORT[theme]||theme}: ${count}"></div>`;
      });
      html += `</div><div class="fp-theme-legend">`;
      themes.forEach(([theme, count]) => {
        html += `<div class="fp-theme-item">
          <div class="fp-theme-dot" style="background:${THEME_PAL[theme]||'#aaa'}"></div>
          <span>${THEME_SHORT[theme]||theme}</span>
          <span class="fp-theme-count">(${count})</span>
        </div>`;
      });
      html += `</div></div>`;
    }

    html += `<div class="fp-paragraphs">` + paragraphs.map(p => `<p class="fp-para">${p}</p>`).join('') + `</div>`;

    card.innerHTML = html;
  }

  function buildFundProfile(n, themes, total) {
    const paras = [];
    const type = n.investor_type || '';
    const stages = (n.stages||[]).map(s=>s.toLowerCase());

    // ── Párrafo 1: Identidad y escala ────────────────────────────────
    const typeDesc = {
      vc: 'fondo de venture capital',
      accelerator: 'aceleradora de startups',
      impact_fund: 'fondo de impacto',
      corporate_vc: 'brazo de corporate venture capital',
      company_builder: 'company builder',
      fund_of_funds: 'fondo de fondos',
      multilateral: 'organismo multilateral',
      development_finance: 'institución de financiamiento al desarrollo'
    }[type] || 'actor de capital';

    let p1 = `<strong>${n.label}</strong> es un ${typeDesc}`;
    if (n.country) p1 += ` con sede en <strong>${countryName(n.country)}</strong>`;
    p1 += '.';

    if (n.aum_m) {
      const tier = n.aum_m >= 1000 ? 'uno de los actores de mayor escala en el ecosistema LATAM'
                 : n.aum_m >= 300  ? 'un fondo de escala significativa para el contexto regional'
                 : n.aum_m >= 80   ? 'un fondo de escala media en el ecosistema'
                 :                   'un actor de escala reducida, probablemente especializado';
      p1 += ` Con <strong>${fmtAum(n.aum_m)}</strong> bajo gestión, es ${tier}.`;
    }

    if (n.degree > 10) p1 += ` Su presencia activa en el mapa —con <strong>${n.degree} deals documentados</strong>— lo posiciona entre los fondos con mayor tracción en el ecosistema BIO.`;
    else if (n.degree > 3) p1 += ` Registra <strong>${n.degree} deals</strong> documentados en el ecosistema BIO LATAM.`;
    else if (n.degree > 0) p1 += ` Su actividad BIO es incipiente con ${n.degree} deal${n.degree>1?'s':''} documentado${n.degree>1?'s':''}.`;
    else p1 += ' No se registran deals BIO documentados en el ecosistema a la fecha.';

    paras.push(p1);

    // ── Párrafo 2: Tesis de inversión ────────────────────────────────
    const hasEarly  = stages.some(s => ['pre-seed','seed'].includes(s));
    const hasMid    = stages.some(s => ['series-a','series-b'].includes(s));
    const hasGrowth = stages.some(s => ['series-c','growth','corporate'].includes(s));

    let p2 = '';
    if (stages.length > 0) {
      if (hasGrowth && hasMid && hasEarly) {
        p2 += `Cubre el espectro completo desde early-stage hasta growth, una capacidad excepcional en el contexto regional donde escasea capital tardío.`;
      } else if (hasGrowth) {
        p2 += `Foco en etapas tardías (${stages.filter(s=>['series-b','series-c','growth','corporate'].includes(s)).map(s=>STAGE_LABEL[s]||s).join(', ')}), lo que lo convierte en uno de los pocos proveedores de capital de crecimiento local para BIO LATAM.`;
      } else if (hasMid && hasEarly) {
        p2 += `Opera con cobertura early-to-mid: desde las primeras etapas de validación hasta Series A${stages.includes('series-b')?' y B':''}.`;
      } else if (hasEarly) {
        p2 += `Inversor early-stage puro, concentrado en el momento de mayor riesgo y mayor potencial de retorno.`;
      } else if (hasMid) {
        p2 += `Participa en etapas de crecimiento temprano (Serie A${stages.includes('series-b')?' y B':''}), cuando los modelos de negocio ya muestran señales de validación.`;
      }
    }

    if (n.ticket_min || n.ticket_max) {
      const fmtK = v => v >= 1e6 ? '$'+(v/1e6).toFixed(1)+'M' : '$'+(v/1e3)+'K';
      const range = (n.ticket_min ? fmtK(n.ticket_min) : '?') + '–' + (n.ticket_max ? fmtK(n.ticket_max) : '?');
      p2 += ` Su rango de ticket de <strong>${range}</strong>`;
      if (n.ticket_max <= 500000) p2 += ' lo alinea con instrumentos de capital semilla y pre-seed.';
      else if (n.ticket_max <= 3000000) p2 += ' es consistente con rondas seed y Serie A del ecosistema regional.';
      else p2 += ' le permite participar en rondas de mayor tamaño dentro de LATAM.';
    }

    if (n.lead_behavior === 'lead') p2 += ' Actúa típicamente como <strong>lead investor</strong>, con capacidad de fijar términos y liderar procesos de due diligence.';
    else if (n.lead_behavior === 'follow') p2 += ' Opera principalmente como co-inversor, siguiendo a leads con mayor conviction sobre el deal.';
    else if (n.lead_behavior === 'both') p2 += ' Flexible en su rol: puede liderar rondas o participar como co-inversor según el deal y etapa.';

    if (n.verticals && n.verticals.length > 0) {
      p2 += ` Declara foco en: <strong>${n.verticals.slice(0,4).join(', ')}</strong>.`;
    }

    if (p2) paras.push(p2);

    // ── Párrafo 3: Perfil BIO y rol en el ecosistema ─────────────────
    if (total > 0) {
      const top = themes[0];
      const topPct = Math.round(top[1] / total * 100);
      const topName = THEME_SHORT[top[0]] || top[0];

      let p3 = '';
      if (topPct >= 75) {
        p3 += `En BIO, su actividad es <strong>altamente concentrada</strong>: ${topPct}% de sus deals caen en <strong>${topName}</strong>.`;
        if (themes.length > 1) p3 += ` El resto se reparte marginalmente entre ${themes.slice(1,3).map(([t])=>THEME_SHORT[t]||t).join(' y ')}.`;
        p3 += ' Esta especialización sugiere una tesis temática deliberada, no oportunista.';
      } else if (topPct >= 50) {
        const second = themes[1] ? ` y <strong>${THEME_SHORT[themes[1][0]]||themes[1][0]}</strong> (${Math.round(themes[1][1]/total*100)}%)` : '';
        p3 += `Thesis dual predominante: <strong>${topName}</strong> (${topPct}%)${second} concentran la mayor parte de su actividad BIO.`;
      } else {
        p3 += `Portfolio BIO diversificado entre <strong>${themes.length} verticales</strong>, sin concentración dominante. `;
        p3 += `Los tres principales son ${themes.slice(0,3).map(([t])=>THEME_SHORT[t]||t).join(', ')}.`;
        p3 += ' Este perfil generalista puede reflejar una tesis de ecosistema o etapa temprana de construcción del portfolio.';
      }

      // Stage gap angle
      if (hasGrowth) {
        p3 += ` Al cubrir etapas tardías con actividad BIO real, cumple una <strong>función crítica de puente</strong>: permite que empresas del ecosistema regional avancen sin depender exclusivamente de capital extranjero.`;
      } else if (!hasMid && !hasGrowth) {
        p3 += ` Su rol es de <strong>generación de pipeline</strong>: la ausencia de cobertura growth significa que las empresas que apoya deberán buscar capital de seguimiento fuera de su portfolio.`;
      }

      paras.push(p3);
    } else if (type === 'multilateral' || type === 'development_finance') {
      paras.push(`Como actor <strong>${typeDesc}</strong>, su función principal no es la inversión directa en startups sino la provisión de capital catalítico —grants, garantías, financiamiento no dilutivo— que reduce el riesgo para inversores privados y habilita el desarrollo del ecosistema BIO regional.`);
    }

    return paras;
  }

  function countryFlag(iso) {
    if (!iso || iso.length !== 2) return '';
    const base = 0x1F1E6;
    const chars = [...iso.toUpperCase()].map(c => String.fromCodePoint(base + c.charCodeAt(0) - 65));
    return chars.join('');
  }

  // ── Sankey / Capital Flow view ──────────────────────────────────────────
  function renderSankey() {
    const wrap = document.getElementById('flow-wrap');
    const svg  = document.getElementById('flow-svg');
    const ttEl = document.getElementById('sk-tooltip');
    const stage = document.querySelector('.ca-stage');
    const W = Math.max(700, (stage ? stage.clientWidth  : 900) - 44);
    const H = Math.max(500, (stage ? stage.clientHeight : 600) - 56);
    svg.innerHTML = '';
    svg.setAttribute('width',  W);
    svg.setAttribute('height', H);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

    if (!D.capital_flow) {
      svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#999" font-size="13">Sin datos de flujo de capital</text>';
      return;
    }

    const NS_S = 'http://www.w3.org/2000/svg';

    // ── Build Sankey nodes (3 layers) ──────────────────────────────────────
    // Layer 0: LPs / Allocators (IDB Lab, JICA, GEF, etc.)
    // Layer 1: VC Funds
    // Layer 2: Bio Themes

    // Gather LP→Fund edges
    const lpFundEdges = D.capital_flow.lp_fund;
    // Gather Fund→Theme edges (only funds with ≥2 bio deals)
    const fundThemeEdges = D.capital_flow.fund_theme.filter(e => e.deal_count >= 1);

    // Collect unique LP ids from lp_fund
    const lpIds = [...new Set(lpFundEdges.map(e => e.source))];
    // Collect unique Fund ids that appear in either layer
    const fundIdsFromLP   = new Set(lpFundEdges.map(e => e.target));
    const fundIdsFromDeals= new Set(fundThemeEdges.map(e => e.source));
    const fundIds = [...new Set([...fundIdsFromLP, ...fundIdsFromDeals])];
    // Themes
    const themeIds = [...new Set(fundThemeEdges.map(e => e.theme))].sort();

    // Node label lookup
    const nodeLabel = {};
    D.nodes.forEach(n => { nodeLabel[n.id] = n.label; });
    // For themes use THEME_SHORT
    themeIds.forEach(t => { nodeLabel[t] = THEME_SHORT[t] || t; });

    // ── Compute node heights (value = sum of flows) ────────────────────────
    // LP value = sum of deal_count of their target funds
    const fundDealTotal = {};
    fundThemeEdges.forEach(e => {
      fundDealTotal[e.source] = (fundDealTotal[e.source]||0) + e.deal_count;
    });

    // Each LP value = sum of its target funds' deal counts
    const lpValue = {};
    lpFundEdges.forEach(e => {
      const fv = fundDealTotal[e.target] || 1;
      lpValue[e.source] = (lpValue[e.source]||0) + fv;
    });

    // Fund value = max(LP-side allocation, deal total)
    const fundValue = {};
    fundIds.forEach(id => {
      fundValue[id] = fundDealTotal[id] || 1;
    });

    // Theme value = sum of deals
    const themeValue = {};
    themeIds.forEach(t => { themeValue[t] = 0; });
    fundThemeEdges.forEach(e => { themeValue[e.theme] = (themeValue[e.theme]||0) + e.deal_count; });

    // ── Layout ──────────────────────────────────────────────────────────────
    const PAD_X = 22, PAD_Y = 22;
    const NODE_W = 14;
    const GAP = 6;
    const LAYER_X = [PAD_X, PAD_X + (W - PAD_X*2) * 0.28, PAD_X + (W - PAD_X*2) * 0.60, W - PAD_X - NODE_W];

    function layoutLayer(ids, valueMap, layerX, totalH) {
      const totalVal = ids.reduce((s, id) => s + (valueMap[id]||1), 0);
      const availH = totalH - PAD_Y * 2;
      const totalGap = (ids.length - 1) * GAP;
      const scaleH = Math.max(1, (availH - totalGap) / Math.max(1, totalVal));
      let y = PAD_Y;
      const nodes = {};
      ids.forEach(id => {
        const h = Math.max(10, (valueMap[id]||1) * scaleH);
        nodes[id] = { x: layerX, y, h, cx: layerX + NODE_W/2, cy: y + h/2 };
        y += h + GAP;
      });
      return nodes;
    }

    const lpNodes    = layoutLayer(lpIds,    lpValue,    LAYER_X[0], H);
    const fundNodes2 = layoutLayer(fundIds,  fundValue,  LAYER_X[2], H);
    const themeNodes = layoutLayer(themeIds, themeValue, LAYER_X[3], H);

    // ── Color ────────────────────────────────────────────────────────────────
    const LP_COL    = '#847E73';
    const FUND_COLS = ['#0B8F87','#1A6DB5','#2A7A42','#8B6D14','#7033BC','#C25A2A','#127A6E','#6B8C3A'];
    const fundColMap = {};
    fundIds.forEach((id, i) => { fundColMap[id] = FUND_COLS[i % FUND_COLS.length]; });

    // ── Draw links LP→Fund ───────────────────────────────────────────────────
    // Accumulate vertical offset per source/target
    const lpOutY   = {}; lpIds.forEach(id => { lpOutY[id]   = lpNodes[id]   ? lpNodes[id].y   : 0; });
    const fundInY  = {}; fundIds.forEach(id => { fundInY[id] = fundNodes2[id] ? fundNodes2[id].y : 0; });
    const fundOutY = {}; fundIds.forEach(id => { fundOutY[id] = fundNodes2[id] ? fundNodes2[id].y : 0; });
    const themeInY = {}; themeIds.forEach(id => { themeInY[id] = themeNodes[id] ? themeNodes[id].y : 0; });

    // total flow scale for LP→fund links: use fund deal total for proportional height
    const totalDeals = Object.values(fundDealTotal).reduce((s,v)=>s+v,0) || 1;

    // LP→Fund links (proportional to target fund's deal count)
    lpFundEdges.forEach(e => {
      const src = lpNodes[e.source];
      const tgt = fundNodes2[e.target];
      if (!src || !tgt) return;
      // height proportional to target fund value
      const fv = fundValue[e.target] || 1;
      const lpTotalForSrc = lpValue[e.source] || 1;
      const srcH = Math.max(2, src.h * fv / lpTotalForSrc);
      const tgtH = Math.max(2, tgt.h * 0.35); // thinner at fund entry

      const x0 = src.x + NODE_W, y0m = (lpOutY[e.source]||src.y) + srcH/2;
      const x1 = tgt.x,          y1m = (fundInY[e.target]||tgt.y) + tgtH/2;
      lpOutY[e.source]  = (lpOutY[e.source]||src.y) + srcH;
      fundInY[e.target] = (fundInY[e.target]||tgt.y) + tgtH;

      const col = fundColMap[e.target] || FUND_COLS[0];
      const path = document.createElementNS(NS_S, 'path');
      const cx = (x0 + x1) / 2;
      path.setAttribute('d', `M${x0},${y0m-srcH/2} C${cx},${y0m-srcH/2} ${cx},${y1m-tgtH/2} ${x1},${y1m-tgtH/2}
        L${x1},${y1m+tgtH/2} C${cx},${y1m+tgtH/2} ${cx},${y0m+srcH/2} ${x0},${y0m+srcH/2} Z`);
      path.setAttribute('fill', col);
      path.setAttribute('opacity', '0.18');
      path.setAttribute('class', 'sk-link');
      svg.appendChild(path);
    });

    // Fund→Theme links
    fundThemeEdges.forEach(e => {
      const src = fundNodes2[e.source];
      const tgt = themeNodes[e.theme];
      if (!src || !tgt) return;
      const fv  = fundValue[e.source] || 1;
      const srcH = Math.max(2, src.h * e.deal_count / fv);
      const tv   = themeValue[e.theme] || 1;
      const tgtH  = Math.max(2, tgt.h * e.deal_count / tv);

      const x0 = src.x + NODE_W, y0m = (fundOutY[e.source]||src.y) + srcH/2;
      const x1 = tgt.x,          y1m = (themeInY[e.theme]||tgt.y)  + tgtH/2;
      fundOutY[e.source] = (fundOutY[e.source]||src.y) + srcH;
      themeInY[e.theme]  = (themeInY[e.theme]||tgt.y) + tgtH;

      const col = THEME_PAL[e.theme] || '#999';
      const path = document.createElementNS(NS_S, 'path');
      const cx = (x0 + x1) / 2;
      path.setAttribute('d', `M${x0},${y0m-srcH/2} C${cx},${y0m-srcH/2} ${cx},${y1m-tgtH/2} ${x1},${y1m-tgtH/2}
        L${x1},${y1m+tgtH/2} C${cx},${y1m+tgtH/2} ${cx},${y0m+srcH/2} ${x0},${y0m+srcH/2} Z`);
      path.setAttribute('fill', col);
      path.setAttribute('opacity', '0.28');
      path.setAttribute('class', 'sk-link');
      // Tooltip data
      path.setAttribute('data-tip', `${nodeLabel[e.source]||e.source} → ${THEME_SHORT[e.theme]||e.theme}: ${e.deal_count} deals`);
      path.style.cursor = 'default';
      svg.appendChild(path);
    });

    // ── Draw nodes ───────────────────────────────────────────────────────────
    function drawNode(id, pos, col, layer) {
      const g = document.createElementNS(NS_S, 'g');
      g.setAttribute('data-id', id);

      const rect = document.createElementNS(NS_S, 'rect');
      rect.setAttribute('x', pos.x); rect.setAttribute('y', pos.y);
      rect.setAttribute('width', NODE_W); rect.setAttribute('height', Math.max(2, pos.h));
      rect.setAttribute('rx', '3'); rect.setAttribute('fill', col);
      g.appendChild(rect);

      // Label
      const lbl = document.createElementNS(NS_S, 'text');
      lbl.setAttribute('class', 'sk-node-label');
      lbl.setAttribute('y', pos.y + pos.h/2);
      lbl.setAttribute('dominant-baseline', 'middle');
      lbl.setAttribute('font-size', '11');
      lbl.setAttribute('fill', '#332b22');
      const shortLabel = (nodeLabel[id]||id).length > 18 ? (nodeLabel[id]||id).slice(0,17)+'…' : (nodeLabel[id]||id);

      if (layer === 3) { // themes: label on right
        lbl.setAttribute('x', pos.x + NODE_W + 5);
        lbl.setAttribute('text-anchor', 'start');
        lbl.setAttribute('fill', col);
        lbl.setAttribute('font-weight', '600');
        lbl.setAttribute('font-size', '10.5');
      } else if (layer === 0) { // LPs: label on left
        lbl.setAttribute('x', pos.x - 5);
        lbl.setAttribute('text-anchor', 'end');
        lbl.setAttribute('fill', LP_COL);
        lbl.setAttribute('font-size', '10.5');
      } else { // funds: label above or below
        lbl.setAttribute('x', pos.x + NODE_W/2);
        lbl.setAttribute('text-anchor', 'middle');
        lbl.setAttribute('y', pos.y - 4);
        lbl.setAttribute('dominant-baseline', 'auto');
        lbl.setAttribute('fill', col);
        lbl.setAttribute('font-weight', '600');
        lbl.setAttribute('font-size', '10');
      }
      lbl.textContent = shortLabel;
      g.appendChild(lbl);
      svg.appendChild(g);
    }

    lpIds.forEach(id  => drawNode(id, lpNodes[id],    LP_COL,                         0));
    fundIds.forEach(id => drawNode(id, fundNodes2[id], fundColMap[id]||FUND_COLS[0],   2));
    themeIds.forEach(id => drawNode(id, themeNodes[id], THEME_PAL[id]||'#999',          3));

    // ── Layer header labels ───────────────────────────────────────────────────
    [['LPs &\nMultilaterales', LAYER_X[0]], ['Fondos VC', LAYER_X[2]], ['Temas BIO', LAYER_X[3]]].forEach(([lbl, lx]) => {
      const t = document.createElementNS(NS_S, 'text');
      t.setAttribute('x', lx + NODE_W/2); t.setAttribute('y', 10);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('font-size', '9.5');
      t.setAttribute('font-weight', '700');
      t.setAttribute('fill', 'var(--muted)');
      t.setAttribute('letter-spacing', '0.04em');
      t.setAttribute('text-transform', 'uppercase');
      t.textContent = lbl;
      svg.appendChild(t);
    });

    // ── Tooltip ───────────────────────────────────────────────────────────────
    svg.addEventListener('mouseover', e => {
      const tip = e.target.dataset.tip;
      if (!tip) { ttEl.style.display = 'none'; return; }
      ttEl.textContent = tip;
      ttEl.style.display = 'block';
    });
    svg.addEventListener('mousemove', e => {
      const rect2 = wrap.getBoundingClientRect();
      ttEl.style.left = (e.clientX - rect2.left + 12) + 'px';
      ttEl.style.top  = (e.clientY - rect2.top  - 10) + 'px';
    });
    svg.addEventListener('mouseout', () => { ttEl.style.display = 'none'; });
  }

}); // DOMContentLoaded
</script>

</body>
